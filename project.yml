name: Timeato

options:
  bundleIdPrefix: com.skalnik
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.42.0"
packages:
  # Sparkle checks for app updates. See https://sparkle-project.org/documentation/
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    MARKETING_VERSION: "2026.10.11"
    CURRENT_PROJECT_VERSION: "202610111221"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
targetTemplates:
  # The settings that the direct target and the App Store target share.
  # XcodeGen appends the sources and dependencies of each target to these.
  # See https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md#target-template
  App:
    type: application
    platform: macOS
    sources:
      - Sources/Timeato
      # The app icon is an Icon Composer file. Xcode compiles it into
      # Assets.car.
      - path: AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - target: TimeatoKit
      - target: TimeatoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skalnik.timeato
        PRODUCT_NAME: Timeato
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Timeato
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
targets:
  TimeatoCore:
    type: framework
    platform: macOS
    sources:
      - Sources/TimeatoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skalnik.timeato.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  TimeatoKit:
    type: framework
    platform: macOS
    sources:
      - Sources/TimeatoKit
    dependencies:
      - target: TimeatoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skalnik.timeato.kit
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  Timeato:
    templates: [App]
    sources:
      - path: Sources/Direct
        # bin/release-macos uses ExportOptions.plist. The entitlements file
        # and Info.plist are build settings. They are not resources.
        excludes: ["ExportOptions.plist", "Timeato.entitlements", "Info.plist"]
    dependencies:
      - package: Sparkle
    settings:
      base:
        # Xcode merges the keys in this file with the generated keys. The
        # Sparkle settings (SUFeedURL, SUPublicEDKey, and the sandbox keys)
        # are in this file.
        INFOPLIST_FILE: Sources/Direct/Info.plist
        # Sparkle uses its XPC services for the download and the install.
        # The entitlements let the app talk to the installer.
        # See https://sparkle-project.org/documentation/sandboxing/
        CODE_SIGN_ENTITLEMENTS: Sources/Direct/Timeato.entitlements
    scheme:
      testTargets:
        - TimeatoTests
  # The Mac App Store build. It does not contain Sparkle. The App Store gives
  # the updates.
  Timeato-AppStore:
    templates: [App]
    sources:
      - path: Sources/AppStore
        excludes: ["ExportOptions.plist", "Timeato.entitlements", "Info.plist"]
    settings:
      base:
        INFOPLIST_FILE: Sources/AppStore/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/AppStore/Timeato.entitlements
      configs:
        # Debug builds of the two app targets go into the same folder. A
        # different name keeps the two apps separate there. Archives use
        # Release, so the App Store gets the name Timeato.
        Debug:
          PRODUCT_NAME: Timeato App Store
    scheme: {}
  TimeatoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/TimeatoTests
    dependencies:
      # UpdaterConfigTests and AppStoreConfigTests read the built apps. The
      # tests do not run in an app.
      - target: Timeato
        link: false
      - target: Timeato-AppStore
        link: false
      - target: TimeatoKit
      - target: TimeatoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skalnik.timeato.tests
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen sets a test host when a test target depends on an app.
        # These empty values remove it.
        BUNDLE_LOADER: ""
        TEST_HOST: ""
