name: Timeato
options:
  bundleIdPrefix: com.skalnik
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
targets:
  TimeatoCore:
    type: framework
    platform: macOS
    sources:
      - Sources/TimeatoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skalnik.timeato.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  TimeatoKit:
    type: framework
    platform: macOS
    sources:
      - Sources/TimeatoKit
    dependencies:
      - target: TimeatoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skalnik.timeato.kit
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  Timeato:
    type: application
    platform: macOS
    sources:
      - Sources/Timeato
    dependencies:
      - target: TimeatoKit
      - target: TimeatoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skalnik.timeato
        PRODUCT_NAME: Timeato
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Timeato
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    scheme:
      testTargets:
        - TimeatoTests
  TimeatoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/TimeatoTests
    dependencies:
      - target: TimeatoKit
      - target: TimeatoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skalnik.timeato.tests
        GENERATE_INFOPLIST_FILE: YES
