name: Timeato

options:
  bundleIdPrefix: com.skalnik
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.42.0"
packages:
  # Sparkle checks for app updates. See https://sparkle-project.org/documentation/
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    MARKETING_VERSION: "2026.10.10"
    CURRENT_PROJECT_VERSION: "202610101344"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
targets:
  TimeatoCore:
    type: framework
    platform: macOS
    sources:
      - Sources/TimeatoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skalnik.timeato.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  TimeatoKit:
    type: framework
    platform: macOS
    sources:
      - Sources/TimeatoKit
    dependencies:
      - target: TimeatoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skalnik.timeato.kit
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  Timeato:
    type: application
    platform: macOS
    sources:
      - path: Sources/Timeato
        # bin/release-macos uses ExportOptions.plist. It is not a resource.
        excludes: ["ExportOptions.plist"]
      # The app icon is an Icon Composer file. Xcode compiles it into
      # Assets.car.
      - path: AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - target: TimeatoKit
      - target: TimeatoCore
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skalnik.timeato
        PRODUCT_NAME: Timeato
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        # Xcode merges the keys in this file with the generated keys. The
        # Sparkle settings (SUFeedURL, SUPublicEDKey) are in this file.
        INFOPLIST_FILE: Sources/Timeato/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Timeato
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    scheme:
      testTargets:
        - TimeatoTests
  TimeatoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/TimeatoTests
    dependencies:
      # UpdaterConfigTests reads the Info.plist of the built app. The tests
      # do not run in the app.
      - target: Timeato
        link: false
      - target: TimeatoKit
      - target: TimeatoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skalnik.timeato.tests
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen sets a test host when a test target depends on an app.
        # These empty values remove it.
        BUNDLE_LOADER: ""
        TEST_HOST: ""
